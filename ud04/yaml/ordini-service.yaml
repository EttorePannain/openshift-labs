# UD04 · Service di Ordini: nome DNS stabile e bilanciamento tra i Pod.
# Versione dell'API e tipo: un Service dà un nome DNS e un indirizzo stabili ai Pod che lo compongono.
apiVersion: v1
kind: Service
metadata:
  # Nome del Service: è anche il nome DNS interno (http://ordini).
  name: ordini
  # Etichetta dell'applicazione.
  labels:
    app: ordini
spec:
  # ClusterIP: indirizzo raggiungibile solo dentro il cluster.
  type: ClusterIP
  # Inoltra il traffico ai Pod con l'etichetta app=ordini.
  selector:
    app: ordini
  # Porte del Service.
  ports:
    # Nome della porta, richiamato dalla Route.
    - name: http
      # Porta su cui il Service ascolta (80).
      port: 80
      # Porta del container a cui inoltra (8080).
      targetPort: 8080
      # Protocollo di trasporto.
      protocol: TCP
