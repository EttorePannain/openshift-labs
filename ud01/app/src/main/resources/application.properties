# Nome dell'applicazione, usato nei log e nei messaggi.
spring.application.name=catalogo-lab
# Porta HTTP: il valore della variabile d'ambiente PORT, oppure 8080 se non è impostata (sintassi ${NOME:predefinito}).
server.port=${PORT:8080}
# Allo stop (SIGTERM) l'applicazione termina le richieste in corso prima di chiudersi.
server.shutdown=graceful
# Tempo massimo concesso a questa chiusura ordinata: 20 secondi.
spring.lifecycle.timeout-per-shutdown-phase=20s
# Dell'Actuator si espongono solo gli endpoint health e info.
management.endpoints.web.exposure.include=health,info
# L'endpoint health non rivela i dettagli dei componenti.
management.endpoint.health.show-details=never
# Abilita i gruppi di health "liveness" e "readiness", usati dalle probe di Kubernetes/OpenShift.
management.endpoint.health.probes.enabled=true
# Ruolo dell'istanza (catalogo, ordini...): da APP_ROLE, predefinito "catalogo".
app.role=${APP_ROLE:catalogo}
# Messaggio restituito da /api/info: da APP_MESSAGE (in OpenShift arriva dalla ConfigMap), predefinito "Ciao da Java".
app.message=${APP_MESSAGE:Ciao da Java}
# Chiave dimostrativa: da DEMO_KEY (in OpenShift arriva dal Secret); vuota se non impostata.
app.demo-key=${DEMO_KEY:}
# Indirizzo del backend chiamato da /api/catalog: da BACKEND_URL, predefinito il Service "catalogo" sulla porta 8080.
app.backend-url=${BACKEND_URL:http://catalogo:8080}
# Abilita il contatore su disco (UD06): da APP_STORAGE_ENABLED, predefinito disabilitato.
app.storage-enabled=${APP_STORAGE_ENABLED:false}
# Cartella in cui il contatore scrive il file: da APP_DATA_DIR, predefinita /runtime.
app.data-dir=${APP_DATA_DIR:/runtime}
