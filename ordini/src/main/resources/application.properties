# Nome dell'applicazione.
spring.application.name=ordini
# Porta HTTP: da PORT, altrimenti 8080 (sintassi ${NOME:predefinito}).
server.port=${PORT:8080}
# Allo stop termina le richieste in corso prima di chiudersi.
server.shutdown=graceful
# Dell'Actuator si espongono solo health e info.
management.endpoints.web.exposure.include=health,info
# L'endpoint health non rivela i dettagli dei componenti.
management.endpoint.health.show-details=never
# Abilita i gruppi liveness e readiness usati dalle probe.
management.endpoint.health.probes.enabled=true
# Messaggio mostrato dall'applicazione: da APP_MESSAGE, predefinito "Ordini pronti".
app.message=${APP_MESSAGE:Ordini pronti}
# Versione mostrata nelle risposte: da APP_VERSION, predefinita v1.
app.version=${APP_VERSION:v1}
# Indirizzo di Catalogo: nel cluster è il nome del Service, sul PC un indirizzo locale.
app.catalogo-url=${CATALOGO_URL:http://catalogo}
